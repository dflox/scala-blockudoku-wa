@import blockudoku.models.Tile
@import util.HtmlUtilities

@(validPreview: List[Tile], invalidPreview: List[Tile], tileIndex: Int)
<div
    id="tile@tileIndex"
    class="tile-marker-wrapper"
    data-previewvalid="@validPreview.map("tile" + _.index).mkString(",")"
    data-previewinvalid="@invalidPreview.map("tile" + _.index).mkString(",")"
    hx-trigger="click"
    hx-post="/place/@tileIndex"
    hx-swap="none"
    >
    @* hx-post is added via js *@
</div>
